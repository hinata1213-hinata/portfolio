<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nemoa — Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --screen-w: 440px;
      --screen-h: 956px;
      --status-h: 54px;
    }

    body {
      min-height: 100vh;
      background: #f0f0f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      padding: 32px 20px;
      gap: 22px;
    }

    .label { font-size: 13px; color: #888; letter-spacing: 0.5px; }
    .note {
      font-size: 12px;
      color: #aaa;
      line-height: 1.6;
      max-width: 440px;
      text-align: center;
      margin-top: -10px;
    }

    /* scale wrapper so it fits short screens without distorting ratio */
    .stage {
      transform-origin: top center;
    }

    /* iPhone frame — bezel via border so inner width stays exact */
    .phone {
      position: relative;
      width: var(--screen-w);
      height: var(--screen-h);
      border: 12px solid #1a1a1a;
      border-radius: 56px;
      background: #000;
      box-shadow:
        0 0 0 2px #3a3a3a,
        0 30px 80px rgba(0,0,0,0.4),
        0 10px 30px rgba(0,0,0,0.2);
    }

    /* side buttons */
    .phone::after {
      content: '';
      position: absolute;
      right: -16px;
      top: 150px;
      width: 4px;
      height: 80px;
      background: #2a2a2a;
      border-radius: 0 2px 2px 0;
      box-shadow: 0 110px 0 #2a2a2a;
    }

    .phone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 44px;
      overflow: hidden;
      background: #fff;
    }

    /* dynamic island */
    .island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 118px;
      height: 33px;
      background: #000;
      border-radius: 20px;
      z-index: 20;
    }

    /* mock iOS status bar (overlay) */
    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: var(--status-h);
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 28px 11px;
      font-weight: 600;
      font-size: 15px;
      color: #000;
      pointer-events: none;
    }
    .status-time { letter-spacing: 0.3px; }
    .status-icons { display: flex; align-items: center; gap: 7px; }
    .status-icons svg { display: block; }

    /* app iframe pushed down below the status bar */
    .phone-screen iframe {
      position: absolute;
      top: var(--status-h);
      left: 0;
      width: 100%;
      height: calc(100% - var(--status-h));
      border: none;
      background: #fff;
    }

    .back-link {
      font-size: 13px;
      color: #888;
      text-decoration: none;
      border: 1px solid #ddd;
      padding: 8px 20px;
      border-radius: 8px;
      background: #fff;
      transition: background 0.2s;
    }
    .back-link:hover { background: #f5f5f5; }
  </style>
</head>
<body>

  <p class="label">Nemoa — QRコードメモ共有アプリ</p>
  <p class="note">※ 実機（iOS / Android）向けアプリをブラウザ表示用に変換したデモです。動作や見た目が本番環境とは少し異なる部分がありますが、ご了承ください。</p>

  <div class="stage" id="stage">
    <div class="phone">
      <div class="phone-screen">
        <div class="island"></div>
        <div class="status-bar">
          <span class="status-time">9:41</span>
          <span class="status-icons">
            <svg width="18" height="12" viewBox="0 0 18 12" fill="#000"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="17" height="12" viewBox="0 0 17 12" fill="#000"><path d="M8.5 2.4c2.6 0 5 1 6.8 2.7l1.4-1.5C14.5 1.5 11.6.3 8.5.3S2.5 1.5.3 3.6l1.4 1.5C3.5 3.4 5.9 2.4 8.5 2.4z"/><path d="M8.5 6c1.4 0 2.7.5 3.7 1.5l1.4-1.5C12.2 4.7 10.4 4 8.5 4S4.8 4.7 3.4 6l1.4 1.5C5.8 6.5 7.1 6 8.5 6z"/><path d="M8.5 9.6l2-2.1c-.5-.5-1.2-.8-2-.8s-1.5.3-2 .8l2 2.1z"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" stroke="#000" stroke-opacity="0.4"/><rect x="2" y="2" width="16" height="9" rx="2" fill="#000"/><path d="M24.5 4.5c.8.3 1.4 1 1.4 2s-.6 1.7-1.4 2v-4z" fill="#000" fill-opacity="0.4"/></svg>
          </span>
        </div>
        <iframe src="./dist/" title="Nemoa App" allow="camera"></iframe>
      </div>
    </div>
  </div>

  <a href="../index.html" class="back-link">← ポートフォリオに戻る</a>

  <script>
    // 画面が短いときだけフレーム全体を縮小（縦横比は維持）
    function fitStage() {
      const stage = document.getElementById('stage');
      const frameH = 956 + 24;          // screen + bezel
      const avail = window.innerHeight - 150; // ラベル・リンク・余白分
      const scale = Math.min(1, avail / frameH);
      stage.style.transform = `scale(${scale})`;
      stage.style.marginBottom = `${(scale - 1) * frameH}px`;
    }
    window.addEventListener('resize', fitStage);
    fitStage();
  </script>

</body>
</html>
