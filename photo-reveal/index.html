<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050814">
<!-- ホーム画面に追加したときに全画面アプリとして開くための設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Photo Reveal">
<title>Photo Reveal</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050814;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    display: grid;
    place-items: center;
  }

  .app {
    position: relative;
    width: min(100vw, 720px);
    height: 100dvh;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 35%, #101a35 0, #050814 45%, #02040a 100%);
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle, rgba(255,255,255,.8) 0 1px, transparent 1.5px),
      radial-gradient(circle, rgba(100,220,255,.6) 0 1px, transparent 1.5px);
    background-size: 73px 91px, 113px 127px;
    background-position: 10px 20px, 35px 60px;
    opacity: .55;
  }

  .top {
    position: absolute;
    top: env(safe-area-inset-top, 0px);
    left: 0;
    right: 0;
    height: 86px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px 20px;
    color: white;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: .04em;
    text-shadow: 0 2px 10px #000;
    z-index: 3;
  }

  .top span {
    padding: 9px 18px;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px;
    background: rgba(0,0,0,.25);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }

  .hud {
    position: absolute;
    left: 8%;
    right: 8%;
    bottom: calc(8% + env(safe-area-inset-bottom, 0px));
    z-index: 3;
    color: white;
    text-align: center;
  }

  .points {
    font-family: "Courier New", monospace;
    font-size: clamp(34px, 9vw, 62px);
    font-weight: 900;
    letter-spacing: .08em;
    color: #55e878;
    text-shadow: 0 0 12px rgba(85,232,120,.35);
    margin-bottom: 14px;
  }

  .bar-wrap {
    position: relative;
    height: 28px;
    border: 3px solid #5a6272;
    border-radius: 7px;
    padding: 3px;
    background: #101522;
    box-shadow: 0 0 0 2px #111, 0 5px 20px rgba(0,0,0,.45);
  }

  /* ポイントが切り替わる位置（20/40/60/80%）の目盛り */
  .ticks {
    position: absolute;
    inset: 3px;
    pointer-events: none;
  }

  .ticks i {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    margin-left: -1px;
    background: rgba(255,255,255,.55);
    box-shadow: 0 0 0 1px rgba(0,0,0,.35);
  }

  .ticks i:nth-child(1) { left: 20%; }
  .ticks i:nth-child(2) { left: 40%; }
  .ticks i:nth-child(3) { left: 60%; }
  .ticks i:nth-child(4) { left: 80%; }

  .bar {
    height: 100%;
    width: 0%;
    border-radius: 2px;
    background: linear-gradient(90deg, #25d95c, #52e477);
    transition: width .08s linear;
  }

  .hint {
    margin-top: 12px;
    color: rgba(255,255,255,.72);
    font-size: 13px;
  }

  .controls {
    position: absolute;
    top: calc(92px + env(safe-area-inset-top, 0px));
    left: 16px;
    right: 16px;
    z-index: 4;
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button, label {
    border: 1px solid rgba(255,255,255,.2);
    color: white;
    background: rgba(10,15,28,.72);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-radius: 999px;
    padding: 9px 14px;
    font-weight: 700;
    cursor: pointer;
  }

  button:active, label:active { transform: scale(.97); }

  input[type=file] { display:none; }

  .done {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transition: opacity .5s ease;
  }

  .done.show { opacity: 1; }

  .done div {
    padding: 18px 28px;
    border-radius: 18px;
    background: rgba(0,0,0,.58);
    border: 1px solid rgba(255,255,255,.22);
    color: white;
    font-size: clamp(24px, 7vw, 42px);
    font-weight: 900;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }

  @media (max-width: 500px) {
    .controls { top: calc(88px + env(safe-area-inset-top, 0px)); }
    .hud { bottom: 7%; }
  }
</style>
</head>
<body>
<div class="app">
  <canvas id="canvas"></canvas>
  <div class="stars"></div>

  <div class="top"><span>PHOTO REVEAL</span></div>

  <div class="controls">
    <label>
      写真を選択
      <input id="file" type="file" accept="image/*">
    </label>
    <button id="start">再スタート</button>
    <button id="speed">完成時間：8秒</button>
  </div>

  <div class="hud">
    <div class="points" id="points">5 Pts</div>
    <div class="bar-wrap">
      <div class="bar" id="bar"></div>
      <div class="ticks"><i></i><i></i><i></i><i></i></div>
    </div>
  </div>

  <div class="done" id="done"><div>COMPLETE!</div></div>
</div>

<script>
(() => {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", { alpha: true });
  const fileInput = document.getElementById("file");
  const startBtn = document.getElementById("start");
  const speedBtn = document.getElementById("speed");
  const pointsEl = document.getElementById("points");
  const barEl = document.getElementById("bar");
  const hintEl = document.getElementById("hint");

  // ヒント表示は無くても動くようにしておく
  const setHint = text => { if (hintEl) hintEl.textContent = text; };
  const doneEl = document.getElementById("done");

  let W = 0, H = 0, dpr = 1;
  let particles = [];
  let image = null;
  let layout = null;
  let running = false;
  let lastT = 0;
  let startTime = 0;
  let duration = 8000;
  let raf = 0;

  const speeds = [5000, 8000, 12000, 20000];
  let speedIndex = 1;

  // 1粒が移動に使う時間（全体を1としたときの割合）。
  // 短いほど「パッと決まって次の粒へ」となり、途中経過が読みやすい。
  const SETTLE_SPAN = 0.3;

  // ボケ画像を作るための小さいオフスクリーン
  const lowres = document.createElement("canvas");
  const lowctx = lowres.getContext("2d");
  let lowW = 0;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = rect.width;
    H = rect.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (image) {
      buildParticles();
      // canvas.width の再設定で中身が消えるため、停止中は今の状態を描き直す
      if (!running) draw(lastT);
    }
  }

  window.addEventListener("resize", resize);
  resize();

  // 初期サンプル画像。写真を選択すると置き換わります。
  function makeDefaultImage() {
    const c = document.createElement("canvas");
    c.width = 900;
    c.height = 1100;
    const x = c.getContext("2d");

    const g = x.createLinearGradient(0,0,900,1100);
    g.addColorStop(0, "#101d44");
    g.addColorStop(.5, "#263e70");
    g.addColorStop(1, "#080b18");
    x.fillStyle = g;
    x.fillRect(0,0,900,1100);

    // サンプルの山・月・星
    x.fillStyle = "#eaf7ff";
    x.beginPath();
    x.arc(670,230,95,0,Math.PI*2);
    x.fill();

    x.fillStyle = "#10182e";
    x.beginPath();
    x.moveTo(0,820); x.lineTo(230,560); x.lineTo(390,790);
    x.lineTo(570,470); x.lineTo(900,850); x.lineTo(900,1100); x.lineTo(0,1100);
    x.fill();

    for(let i=0;i<90;i++){
      x.fillStyle = `rgba(255,255,255,${.2+Math.random()*.8})`;
      x.fillRect(Math.random()*900, Math.random()*650, 2, 2);
    }

    const img = new Image();
    img.src = c.toDataURL();
    img.onload = () => {
      image = img;
      buildParticles();
      restart();
    };
  }

  function computeLayout() {
    const iw = image.naturalWidth;
    const ih = image.naturalHeight;
    const scale = Math.min(W * .88 / iw, H * .62 / ih);
    const dw = iw * scale;
    const dh = ih * scale;
    return {
      iw, ih, scale, dw, dh,
      ox: (W - dw) / 2,
      oy: Math.max(150, (H - dh) / 2 - 40)
    };
  }

  function buildParticles() {
    if (!image) return;

    layout = computeLayout();
    const { iw, ih, scale, ox, oy } = layout;
    const maxDim = Math.max(W, H);

    // 粒の密度。スマホでも軽いように上限を設定。
    const step = Math.max(5, Math.round(Math.min(iw, ih) / 170));
    const off = document.createElement("canvas");
    off.width = iw;
    off.height = ih;
    const oc = off.getContext("2d", { willReadFrequently: true });
    oc.drawImage(image, 0, 0);
    const data = oc.getImageData(0, 0, iw, ih).data;

    particles = [];

    for (let y = 0, gy = 0; y < ih; y += step, gy++) {
      for (let x = 0, gx = 0; x < iw; x += step, gx++) {
        const i = (y * iw + x) * 4;
        const a = data[i + 3];
        if (a < 50) continue;

        const brightness = (data[i] + data[i+1] + data[i+2]) / 3;
        if (brightness < 8) continue;

        // 到着順 ord を R2 低差異列で決める。
        // ランダムな順番と違い、どの瞬間に切っても「画面全体に均等に」
        // 粒が置かれるので、序盤から粗い写真として見え始める。
        const ord = (gx * 0.7548776662 + gy * 0.5698402909 + Math.random() * 0.18) % 1;

        // 早く決まる粒ほど遠くから飛来し、後の粒は近くからそっと収まる。
        // これで中盤に遠方の散らばりが残らない。
        const far = Math.pow(1 - ord, 2.2);
        const dist = maxDim * (0.04 + 0.5 * far) * (0.4 + Math.random() * 0.7);
        const angle = Math.random() * Math.PI * 2;

        particles.push({
          tx: ox + x * scale,
          ty: oy + y * scale,
          dx: Math.cos(angle) * dist,
          dy: Math.sin(angle) * dist,
          t0: ord * (1 - SETTLE_SPAN),
          r: data[i],
          g: data[i+1],
          b: data[i+2],
          a: a / 255,
          size: 1.3 + Math.random() * 2.2,
          wobble: Math.random() * Math.PI * 2
        });
      }
    }

    // 粒が多すぎる場合は間引く
    const maxParticles = 13000;
    if (particles.length > maxParticles) {
      particles = particles.filter((_,i) =>
        i % Math.ceil(particles.length / maxParticles) === 0
      );
    }
  }

  function ease(t) {
    // 滑らかな加速→減速
    return t < .5
      ? 4*t*t*t
      : 1 - Math.pow(-2*t+2, 3)/2;
  }

  // 背面のボケ写真。時間とともに解像度と濃さが上がり、
  // 「ピントが合っていく」ように被写体が読めるようになる。
  function drawFocusLayer(t) {
    const L = layout;
    const w = Math.max(3, Math.round(4 + Math.pow(t, 2.2) * 420));
    const sharp = t > .97;

    if (!sharp) {
      if (w !== lowW) {
        lowW = w;
        lowres.width = w;
        lowres.height = Math.max(2, Math.round(w * L.ih / L.iw));
      }
      lowctx.clearRect(0, 0, lowres.width, lowres.height);
      lowctx.drawImage(image, 0, 0, lowres.width, lowres.height);
    }

    ctx.save();
    ctx.globalAlpha = 0.12 + 0.82 * Math.pow(t, 1.1);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(sharp ? image : lowres, L.ox, L.oy, L.dw, L.dh);
    ctx.restore();
  }

  function draw(t) {
    lastT = t;
    ctx.clearRect(0,0,W,H);
    if (!layout) return;

    drawFocusLayer(t);

    for (const p of particles) {
      const local = Math.max(0, Math.min(1, (t - p.t0) / SETTLE_SPAN));
      const e = ease(local);
      const rest = 1 - e;

      // 未確定の粒は「大きく淡いボケ玉」として目的地の近くに漂う。
      const wobble = rest * 6;
      const x = p.tx + p.dx * rest + Math.sin(p.wobble + t * 9) * wobble;
      const y = p.ty + p.dy * rest + Math.cos(p.wobble + t * 8) * wobble;

      ctx.globalAlpha = p.a * (0.12 + 0.88 * e);
      ctx.beginPath();
      ctx.arc(x, y, p.size * (1 + 1.8 * rest), 0, Math.PI*2);
      ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function hintFor(t) {
    if (t < .25) return "ぼんやり… 何が写っているかな？";
    if (t < .5)  return "だんだん形が見えてきました";
    if (t < .8)  return "もうすぐピントが合います";
    return "仕上げ中！";
  }

  function loop(now) {
    if (!running) return;

    const elapsed = now - startTime;
    const t = Math.min(1, elapsed / duration);

    draw(t);

    const percent = Math.round(t * 100);
    barEl.style.width = percent + "%";
    // 早く分かるほど高得点。5→4→3→2→1 と整数で下がる。
    pointsEl.textContent = Math.max(1, 5 - Math.floor(t * 5)) + " Pts";
    setHint(hintFor(t));

    if (t >= 1) {
      running = false;
      draw(1);
      pointsEl.textContent = "0 Pts";
      setHint("完成！");
      doneEl.classList.add("show");
      return;
    }

    raf = requestAnimationFrame(loop);
  }

  function restart() {
    cancelAnimationFrame(raf);
    if (!particles.length) return;
    running = true;
    doneEl.classList.remove("show");
    startTime = performance.now();
    barEl.style.width = "0%";
    pointsEl.textContent = "5 Pts";
    setHint(hintFor(0));
    raf = requestAnimationFrame(loop);
  }

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) return;

    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      image = img;
      buildParticles();
      restart();
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });

  startBtn.addEventListener("click", restart);

  speedBtn.addEventListener("click", () => {
    speedIndex = (speedIndex + 1) % speeds.length;
    duration = speeds[speedIndex];
    speedBtn.textContent = `完成時間：${duration/1000}秒`;
    restart();
  });

  // スマホで長押しメニューなどを出しにくくする
  document.addEventListener("contextmenu", e => e.preventDefault());

  makeDefaultImage();
})();
</script>
</body>
</html>
